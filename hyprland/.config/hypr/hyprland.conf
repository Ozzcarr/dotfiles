animations {
  bezier=snappy, 0.25, 1, 0.5, 1
  animation=global, 1, 1.5, snappy
  enabled=true
}

bind=SUPER,Return,exec,kitty
bind=SUPER,SPACE,exec,rofi -show drun -modi "drun,calc" -calc-command "echo -n '{result}' | wl-copy"
bind=SUPER SHIFT,N,exec,swaync-client -rs
bind=SUPER SHIFT,R,exec,sh -c 'pkill waybar && hyprctl dispatch exec waybar'
bind=SUPER,W,exec,firefox
bind=SUPER SHIFT,W,exec,sh -c 'firefox --private-window || firefox --incognito'
bind=SUPER,E,exec,code
bind=SUPER,Y,exec,kitty -e yazi
bind=SUPER,S,exec,hyprshot -m region -o $HOME/Pictures/Screenshots
bind=SUPER SHIFT,S,exec,hyprshot -m window -o $HOME/Pictures/Screenshots
bind=SUPER CTRL,S,exec,hyprshot -m output -o $HOME/Pictures/Screenshots
bind=SUPER,D,exec,vesktop
bind=SUPER SHIFT,M,exec,vesktop-mute
bind=SUPER SHIFT,D,exec,vesktop-deafen
bind=SUPER,O,togglespecialworkspace,obs
bind=SUPER,M,togglespecialworkspace,spotify
bind=SUPER,N,togglespecialworkspace,config
bind=SUPER,C,exec,hyprpicker -a
bind=SUPER,G,togglespecialworkspace,gamestore
bind=SUPER,T,exec, thunar
bind=SUPER,A,exec,pavucontrol
bind=SUPER,B,exec,wallpaper
bind=SUPER,escape,exec,hyprlock
bind=SUPER SHIFT,escape,exec,wlogout
bind=SUPER,Q,killactive,
bind=SUPER SHIFT,Q,exec,hyprctl activewindow | awk '$1=="pid:"{print $2}' | xargs -r kill
bind=SUPER,V,exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=SUPER,I,layoutmsg,togglesplit
bind=SUPER,F,fullscreen,
bind=SUPER SHIFT,F,togglefloating,
bind=SUPER SHIFT,C,exit,
bind=SUPER SHIFT,left,movewindow,l
bind=SUPER SHIFT,right,movewindow,r
bind=SUPER SHIFT,up,movewindow,u
bind=SUPER SHIFT,down,movewindow,d
bind=SUPER SHIFT,h,movewindow,l
bind=SUPER SHIFT,l,movewindow,r
bind=SUPER SHIFT,k,movewindow,u
bind=SUPER SHIFT,j,movewindow,d
bind=SUPER CTRL,left,swapwindow,l
bind=SUPER CTRL,right,swapwindow,r
bind=SUPER CTRL,up,swapwindow,u
bind=SUPER CTRL,down,swapwindow,d
bind=SUPER CTRL,43,swapwindow,l
bind=SUPER CTRL,46,swapwindow,r
bind=SUPER CTRL,45,swapwindow,u
bind=SUPER CTRL,44,swapwindow,d
bind=SUPER,left,resizeactive,-60 0
bind=SUPER,right,resizeactive,60 0
bind=SUPER,up,resizeactive,0 -60
bind=SUPER,down,resizeactive,0 60
bind=SUPER,h,movefocus,l
bind=SUPER,l,movefocus,r
bind=SUPER,k,movefocus,u
bind=SUPER,j,movefocus,d
bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10
bind=SUPER SHIFT,1,movetoworkspace,1
bind=SUPER SHIFT,2,movetoworkspace,2
bind=SUPER SHIFT,3,movetoworkspace,3
bind=SUPER SHIFT,4,movetoworkspace,4
bind=SUPER SHIFT,5,movetoworkspace,5
bind=SUPER SHIFT,6,movetoworkspace,6
bind=SUPER SHIFT,7,movetoworkspace,7
bind=SUPER SHIFT,8,movetoworkspace,8
bind=SUPER SHIFT,9,movetoworkspace,9
bind=SUPER SHIFT,0,movetoworkspace,10
bind=SUPER CONTROL,right,workspace,e+1
bind=SUPER CONTROL,left,workspace,e-1
bind=SUPER,mouse_down,workspace, e+1
bind=SUPER,mouse_up,workspace, e-1
bind=ALT,Tab,cyclenext
bind=ALT,Tab,bringactivetotop
bind=,XF86AudioRaiseVolume,exec,playerctl --player=spotify volume 0.05+
bind=,XF86AudioLowerVolume,exec,playerctl --player=spotify volume 0.05-
bind= ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=,XF86AudioPlay, exec, playerctl --player=spotify,firefox play-pause
bind=,XF86AudioPause, exec, playerctl --player=spotify,firefox play-pause
bind=,XF86AudioNext, exec, playerctl --player=spotify,firefox next
bind=,XF86AudioPrev, exec, playerctl --player=spotify,firefox previous
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%

bindm=SUPER, mouse:272, movewindow
bindm=SUPER, mouse:273, resizewindow

cursor {
  enable_hyprcursor=false
  inactive_timeout=3
  no_hardware_cursors=0
  no_warps=true
  sync_gsettings_theme=true
  warp_on_change_workspace=2
}

debug {
  vfr=true
}

decoration {
  blur {
    enabled=true
    ignore_opacity=false
    new_optimizations=true
    passes=3
    size=5
  }

  shadow {
    color=rgba(1a1a1aee)
    enabled=true
    range=4
    render_power=3
  }
  rounding=5
}

dwindle {
  force_split=2
  preserve_split=true
}

ecosystem {
  no_donation_nag=true
  no_update_news=false
}

env=NIXOS_OZONE_WL, 1
env=NIXPKGS_ALLOW_UNFREE, 1
env=XDG_CURRENT_DESKTOP, Hyprland
env=XDG_SESSION_TYPE, wayland
env=XDG_SESSION_DESKTOP, Hyprland
env=GDK_BACKEND, wayland, x11
env=CLUTTER_BACKEND, wayland
env=QT_QPA_PLATFORM=wayland;xcb
env=QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env=QT_AUTO_SCREEN_SCALE_FACTOR, 1
env=SDL_VIDEODRIVER, x11
env=MOZ_ENABLE_WAYLAND, 1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1
env=TERMINAL,kitty
env=XDG_TERMINAL_EMULATOR,kitty

exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=dbus-update-activation-environment --all --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start hyprpolkitagent
exec-once=killall -q awww;sleep .5 && awww-daemon
exec-once=killall -q waybar;sleep .5 && waybar
exec-once=killall -q swaync;sleep .5 && swaync
exec-once=nm-applet --indicator
exec-once=sleep 1.0 && wallpaper restore

general {
  border_size=1
  col.active_border=rgb(cba6f7)
  col.inactive_border=rgb(181825)
  gaps_in=4
  gaps_out=3,8,8,8
  layout=dwindle
  resize_on_border=true
}

gesture=3, horizontal, workspace

gestures {
  workspace_swipe_cancel_ratio=0.500000
  workspace_swipe_create_new=1
  workspace_swipe_distance=500
  workspace_swipe_forever=1
  workspace_swipe_invert=1
  workspace_swipe_min_speed_to_force=30
}

input {
  kb_options=grp:alt_caps_toggle
  kb_options=caps:super

  touchpad {
    disable_while_typing=true
    natural_scroll=true
    scroll_factor=0.800000
  }
  float_switch_override_focus=0
  follow_mouse=1
  kb_layout=se
  numlock_by_default=true
  repeat_delay=300
  sensitivity=0
}

master {
  mfact=0.500000
  new_on_top=1
  new_status=master
}

misc {
  anr_missed_pings=15
  disable_hyprland_logo=true
  disable_splash_rendering=true
  enable_anr_dialog=true
  enable_swallow=false
  initial_workspace_tracking=0
  key_press_enables_dpms=false
  layers_hog_keyboard_focus=true
  mouse_move_enables_dpms=true
  vrr=0
}

render {
  direct_scanout=0
}

windowrule=no_blur true, match:class ^(\bresolve\b)$, match:xwayland true
windowrule=tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule=tag +terminal, match:class ^(com.mitchellh.ghostty|org.wezfurlong.wezterm|Alacritty|kitty)$
windowrule=tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule=tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$
windowrule=tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule=tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule=tag +projects, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule=tag +projects, match:class ^(VSCode|code-url-handler)$
windowrule=tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrule=tag +im, match:class ^([Ff]erdium)$
windowrule=tag +im, match:class ^([Ww]hatsapp-for-linux)$
windowrule=tag +im, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrule=tag +im, match:class ^(teams-for-linux)$
windowrule=tag +games, match:class ^(gamescope)$
windowrule=tag +games, match:class ^(steam_app_\d+)$
windowrule=tag +gamestore, match:class ^([Ss]team)$
windowrule=tag +gamestore, match:title ^([Ll]utris)$
windowrule=tag +gamestore, match:class ^(com.heroicgameslauncher.hgl)$
windowrule=tag +settings, match:class ^(gnome-disks|wihotspot(-gui)?)$
windowrule=tag +settings, match:class ^([Rr]ofi)$
windowrule=tag +settings, match:class ^(file-roller|org.gnome.FileRoller)$
windowrule=tag +settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule=tag +settings, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule=tag +settings, match:class ^(nwg-look|qt5ct|qt6ct|[Yy]ad)$
windowrule=tag +settings, match:class (xdg-desktop-portal-gtk)
windowrule=tag +settings, match:class (.blueman-manager-wrapped)
windowrule=tag +settings, match:class (nwg-displays)
windowrule=workspace special:gamestore, match:class ^([Ss]team)$
windowrule=move 72% 7%, match:title ^(Picture-in-Picture)$
windowrule=center true, match:class ^([Ff]erdium)$
windowrule=float true, match:class ^([Ww]aypaper)$
windowrule=center true, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule=center true, match:title ^(Authentication Required)$
windowrule=idle_inhibit fullscreen, match:fullscreen true
windowrule=float true, match:tag settings*
windowrule=float true, match:class ^([Ff]erdium)$
windowrule=float true, match:title ^(Picture-in-Picture)$
windowrule=float true, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule=float true, match:title ^(Authentication Required)$
windowrule=float true, match:class (codium|codium-url-handler|VSCodium), match:title negative:(.*codium.*|.*VSCodium.*)
windowrule=float true, match:class ^(com.heroicgameslauncher.hgl)$, match:title negative:(Heroic Games Launcher)
windowrule=float true, match:class ^([Ss]team)$, match:title negative:^([Ss]team)$
windowrule=float true, match:initial_title (Add Folder to Workspace)
windowrule=float true, match:initial_title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=float true, match:title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=center true, match:initial_title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=center true, match:title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=float true, match:initial_title (wants to save)
windowrule=size 70% 60%, match:initial_title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=size 70% 60%, match:title ^([Oo]pen|[Ss]ave|[Ss]elect|[Cc]hoose).*(file|files|folder|folders|File|Files|Folder|Folders).*$
windowrule=size 70% 60%, match:initial_title (Add Folder to Workspace)
windowrule=size 70% 70%, match:tag settings*
windowrule=size 60% 70%, match:class ^([Ff]erdium)$
windowrule=opacity 1.0 1.0, match:tag browser*
windowrule=opacity 0.9 0.8, match:tag projects*
windowrule=opacity 0.9 0.9, match:tag im*
windowrule=opacity 0.9 0.8, match:tag file-manager*
windowrule=opacity 0.9 0.9, match:tag terminal*
windowrule=opacity 0.9 0.9, match:class ^(com.anthropic.Claude)$
windowrule=opacity 0.8 0.7, match:tag settings*
windowrule=opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule=opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule=opacity 1.0 1.0, match:title ^(Picture-in-Picture)$
windowrule=pin true, match:class ^([Ss]team)$, match:title negative:^(Steam|Friends List)$
windowrule=pin true, match:title ^(Picture-in-Picture)$
windowrule=keep_aspect_ratio true, match:title ^(Picture-in-Picture)$
windowrule=no_blur true, match:tag games*
windowrule=fullscreen true, match:tag games*

workspace=special:config, on-created-empty: code ~/nix-config
workspace=special:obs, on-created-empty: obs
workspace=special:spotify, on-created-empty: spotify
workspace=special:gamestore, on-created-empty: steam

xwayland {
  force_zero_scaling=true
}

monitor=,preferred,auto,auto
source = monitors.conf
