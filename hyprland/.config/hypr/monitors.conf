# Machine-specific monitor layout and workspace assignments.
#
# hyprland.conf's `source = monitors.conf` requires this file to exist (a
# missing source target is a hard parse error, not a soft fallback), so this
# stays a tracked file with this desktop's layout as the checked-in default,
# rather than a gitignored per-machine file.
#
# To customize on another machine without your edits showing up as a dirty
# diff here, run once after cloning:
#   git update-index --skip-worktree hyprland/.config/hypr/monitors.conf
# then edit this file locally to match that machine's monitors.

monitor = DP-2,2560x1440@165,1920x0,1
monitor = HDMI-A-1,1920x1080@60,0x250,1

# Bind workspaces to monitors
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2

workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
