promptToReturnFromSubprocess: false
os:
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
customCommands:
  - key: "C"
    context: "files"
    description: "Generate commit message with Claude Code"
    command: >
      sh -c 'if git diff --cached --quiet; then echo "No staged changes. Nothing to generate."; exit 0; fi; echo "Generating commit message with Claude..."; message="$(git diff --cached | /home/oscar/.local/bin/claude -p "Generate a concise git commit message for these staged changes. Output ONLY the RAW COMMIT MESSAGE with NO FOOTER, no markdown, no code blocks, no backticks, NO EXPLANATIONS. Use conventional commit format without scopes. The specified commit type should be justified." --model sonnet --output-format text)"; subject="$(printf "%s\n" "$message" | sed -n "1{s/[[:space:]]*$//;p;q}")"; printf "%s" "$subject" | xsel --clipboard --input; echo "Copied suggested commit message to clipboard:"; printf "%s\n" "$message"'

    output: logWithPty
git:
  pagers:
    - colorArg: always
      pager: delta --paging=never
