unbind r
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Splits: | and - look like the divider they create. New panes/windows
# inherit the current pane's directory instead of starting at $HOME.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane manipulation
bind X kill-pane
bind -r "<" swap-pane -U
bind -r ">" swap-pane -D
bind -r "=" select-layout -E

# Resize with Ctrl+arrows, no prefix. Neovim gets first refusal: if the
# focused pane is running it, the keys are forwarded and Neovim resizes its
# own splits (and hands them back to tmux when it has none on that axis).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?)(-wrapped)?(diff)?$'"

bind -n C-Left  if-shell "$is_vim" 'send-keys C-Left'  'resize-pane -L 2'
bind -n C-Down  if-shell "$is_vim" 'send-keys C-Down'  'resize-pane -D 2'
bind -n C-Up    if-shell "$is_vim" 'send-keys C-Up'    'resize-pane -U 2'
bind -n C-Right if-shell "$is_vim" 'send-keys C-Right' 'resize-pane -R 2'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

set-option -g status-position top

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag, 󰊓,}"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# tmux.service starts a sessionless server at login for the restore to land in.
# The default exit-empty would tear that server down before it gets there.
set -g exit-empty off

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Auto-install TPM itself if missing, then initialize it (keep at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm'"
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default
